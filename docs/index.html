<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ELAN Languages Apps</title>
  <meta name="description" content="Download the latest version of ELAN Languages Windows applications.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%232563eb'/><path d='M16 7v13m0 0-5-5m5 5 5-5M9 25h14' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
  <style>
    :root {
      --bg: #f6f7f9; --card: #ffffff; --text: #111827; --muted: #6b7280; --border: #e5e7eb;
      --accent: #2563eb; --accent-text: #ffffff; --soft: #f3f4f6;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1115; --card: #181b21; --text: #f3f4f6; --muted: #9ca3af; --border: #2a2f38;
        --accent: #3b82f6; --soft: #22262e;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .wrap { max-width: 920px; margin: 0 auto; padding: 56px 16px 40px; }
    header { margin-bottom: 36px; }
    .brand { font-size: 14px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
    h1 { font-size: clamp(28px, 5vw, 40px); line-height: 1.15; margin: 8px 0 12px; }
    header p { color: var(--muted); margin: 0; max-width: 60ch; }
    section + section { margin-top: 44px; }
    section > h3 { font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 14px; }

    .grid { display: grid; gap: 20px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 400px), 1fr)); }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 24px;
      display: flex; flex-direction: column; gap: 16px; transition: box-shadow .2s, border-color .2s;
    }
    .card:target { border-color: var(--app); box-shadow: 0 0 0 3px color-mix(in srgb, var(--app) 25%, transparent); }
    .top { display: flex; gap: 14px; align-items: center; }
    .logo {
      width: 52px; height: 52px; border-radius: 14px; flex: none; display: grid; place-items: center;
      background: var(--app); color: #fff; font-weight: 700; font-size: 20px;
    }
    .card h2 { font-size: 20px; margin: 0; }
    .meta { color: var(--muted); font-size: 14px; }
    .version {
      display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px;
      background: color-mix(in srgb, var(--app) 14%, transparent); color: var(--app); margin-left: 6px; vertical-align: 2px;
    }
    .desc { margin: 0; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: auto; }
    .btn {
      display: inline-flex; align-items: center; gap: 8px; border-radius: 10px; padding: 10px 16px;
      font: inherit; font-weight: 600; font-size: 15px; text-decoration: none; cursor: pointer; border: 1px solid transparent;
    }
    .btn-primary { background: var(--app); color: #fff; }
    .btn-primary:hover { filter: brightness(1.08); }
    .btn-ghost { background: var(--soft); color: var(--text); border-color: var(--border); }
    .btn-ghost:hover { border-color: var(--muted); }
    .btn svg { width: 18px; height: 18px; }
    .size { font-weight: 400; opacity: .85; font-size: 13px; }

    details { border-top: 1px solid var(--border); padding-top: 12px; font-size: 14px; }
    summary { cursor: pointer; color: var(--muted); font-weight: 500; }
    .notes { margin-top: 10px; }
    .notes ul { padding-left: 20px; margin: 6px 0; }
    .notes p { margin: 6px 0; }
    .notes a, .notes-link { color: var(--accent); }

    .skeleton { color: var(--muted); }
    .error { color: var(--muted); font-size: 14px; }

    .toast {
      position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0;
      background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px;
      transition: opacity .2s, transform .2s; pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">ELAN Languages</div>
      <h1>Downloads</h1>
      <p>Get the latest version of our tools. Once installed, they update automatically.</p>
    </header>

    <main>
      <section>
        <h3>Browser extension</h3>
        <div class="grid" id="extensions"></div>
      </section>
      <section>
        <h3>Windows applications</h3>
        <div class="grid" id="apps"><p class="skeleton">Loading applications…</p></div>
      </section>
    </main>
  </div>
  <div class="toast" id="toast">Link copied</div>

  <script src="apps.js?v=2"></script>
  <script>
    const ICON_DOWNLOAD = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 20h14"/></svg>';
    const ICON_LINK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>';

    const escapeHtml = (s) => s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    // Minimal Markdown renderer for release notes (lists, bold, links, code).
    function renderMarkdown(md) {
      const inline = (s) => escapeHtml(s)
        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
        .replace(/`(.+?)`/g, "<code>$1</code>")
        .replace(/\[(.+?)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2">$1</a>');
      let html = "", inList = false;
      for (const raw of md.split(/\r?\n/)) {
        const line = raw.trim();
        const item = line.match(/^[-*]\s+(.*)/);
        if (item) {
          if (!inList) { html += "<ul>"; inList = true; }
          html += `<li>${inline(item[1])}</li>`;
          continue;
        }
        if (inList) { html += "</ul>"; inList = false; }
        if (line) html += `<p>${inline(line.replace(/^#+\s*/, ""))}</p>`;
      }
      return html + (inList ? "</ul>" : "");
    }

    const formatSize = (b) => `${Math.round(b / 1048576)} MB`;
    const formatDate = (d) => new Date(d).toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" });
    const permalink = (app) => new URL(`download.html?app=${app.id}`, location.href).href;

    const initials = (name) => name.split(/\s+/).filter((w) => /^[A-Z]/.test(w)).map((w) => w[0]).join("").slice(0, 2);

    function newCard(item) {
      const el = document.createElement("article");
      el.className = "card";
      el.id = item.id;
      el.style.setProperty("--app", item.color);
      return el;
    }

    function card(app, info) {
      const el = newCard(app);
      el.innerHTML = `
        <div class="top">
          <div class="logo" aria-hidden="true">${initials(app.name)}</div>
          <div>
            <h2>${escapeHtml(app.name)}<span class="version">v${info.version}</span></h2>
            <div class="meta">Windows · updated ${formatDate(info.date)}</div>
          </div>
        </div>
        <p class="desc">${escapeHtml(app.description)}</p>
        <div class="actions">
          <a class="btn btn-primary" href="${info.url}">${ICON_DOWNLOAD} Download <span class="size">${formatSize(info.size)}</span></a>
          <button class="btn btn-ghost" type="button" data-copy="${permalink(app)}">${ICON_LINK} Copy link</button>
        </div>
        ${info.notes ? `
        <details>
          <summary>What's new in ${info.version}</summary>
          <div class="notes">${renderMarkdown(info.notes)}</div>
        </details>` : ""}`;
      return el;
    }

    function extensionCard(ext) {
      const el = newCard(ext);
      el.innerHTML = `
        <div class="top">
          <div class="logo" aria-hidden="true">${initials(ext.name)}</div>
          <div>
            <h2>${escapeHtml(ext.name)}</h2>
            <div class="meta">${ext.stores.map((s) => escapeHtml(s.label)).join(" · ")}</div>
          </div>
        </div>
        <p class="desc">${escapeHtml(ext.description)}</p>
        <div class="actions">
          ${ext.stores.map((s, i) => `<a class="btn ${i ? "btn-ghost" : "btn-primary"}" href="${s.url}">${ICON_DOWNLOAD} Add to ${escapeHtml(s.label)}</a>`).join("")}
        </div>`;
      return el;
    }

    function showToast(text) {
      const t = document.getElementById("toast");
      t.textContent = text;
      t.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => t.classList.remove("show"), 1800);
    }

    document.addEventListener("click", async (e) => {
      const btn = e.target.closest("[data-copy]");
      if (!btn) return;
      try {
        await navigator.clipboard.writeText(btn.dataset.copy);
        showToast("Download link copied — it always points to the latest version");
      } catch {
        prompt("Copy this link:", btn.dataset.copy);
      }
    });

    const extensions = document.getElementById("extensions");
    for (const ext of EXTENSIONS) extensions.appendChild(extensionCard(ext));

    (async () => {
      const container = document.getElementById("apps");
      try {
        const releases = await fetchReleases();
        container.innerHTML = "";
        for (const app of APPS) {
          const info = resolveApp(app, releases);
          if (info) container.appendChild(card(app, info));
        }
        if (location.hash) document.getElementById(location.hash.slice(1))?.scrollIntoView({ block: "center" });
      } catch {
        container.innerHTML = `<p class="error">The application list could not be loaded right now.
          <a class="notes-link" href="https://github.com/${REPO}/releases">See downloads on GitHub</a>.</p>`;
      }
    })();
  </script>
</body>
</html>
