<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Downloading…</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='white'/><path d='M7 9h18M7 16h18M7 23h18' stroke='%2300a2e1' stroke-width='4' stroke-linecap='round'/></svg>">
  <style>
    :root { --bg: #f6f7f9; --text: #111827; --accent: #2563eb; --font: system-ui, -apple-system, "Segoe UI", sans-serif; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0f1115; --text: #f3f4f6; --accent: #3b82f6; }
    }
    body { font-family: var(--font); background: var(--bg); color: var(--text);
           display: grid; place-items: center; min-height: 100vh; margin: 0; padding: 16px; text-align: center; }
    a { color: var(--accent); }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>
  <p id="msg">Preparing download…</p>
  <noscript><p><a href="https://github.com/elanlanguages/Public-Releases/releases">See all downloads on GitHub</a></p></noscript>
  <script src="apps.js?v=7"></script>
  <script>
    // Permanent link: download.html?app=<id> redirects to the latest installer.
    (async () => {
      const msg = document.getElementById("msg");
      const id = new URLSearchParams(location.search).get("app");
      if (EXTENSIONS.some((e) => e.id === id)) {
        location.replace(`./#${id}`);
        return;
      }
      const app = APPS.find((a) => a.id === id);
      if (!app) {
        msg.innerHTML = 'Unknown application. <a href="./">See all applications</a>';
        return;
      }
      try {
        const info = resolveApp(app, await fetchReleases());
        if (!info) throw new Error("not found");
        msg.innerHTML = `Downloading ${app.name} ${info.version}… ` +
          `<br><br>If nothing happens, <a href="${info.url}">click here</a>.`;
        location.replace(info.url);
      } catch {
        msg.innerHTML = `The latest version of ${app.name} could not be found.` +
          `<br><br><a href="${RELEASE_PAGE(app.channel)}">Open the download page on GitHub</a>`;
      }
    })();
  </script>
</body>
</html>
