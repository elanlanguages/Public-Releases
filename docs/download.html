<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Downloading…</title>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #f6f7f9; color: #1f2937;
           display: grid; place-items: center; min-height: 100vh; margin: 0; padding: 16px; text-align: center; }
    a { color: #2563eb; }
  </style>
</head>
<body>
  <p id="msg">Preparing download…</p>
  <script src="apps.js"></script>
  <script>
    // Permanent link: download.html?app=<id> redirects to the latest installer.
    (async () => {
      const msg = document.getElementById("msg");
      const id = new URLSearchParams(location.search).get("app");
      const app = APPS.find((a) => a.id === id);
      if (!app) {
        msg.innerHTML = 'Unknown application. <a href="./">See all applications</a>';
        return;
      }
      try {
        const info = resolveApp(app, await fetchReleases());
        if (!info) throw new Error("not found");
        msg.innerHTML = `Downloading ${app.name} ${info.version}… ` +
          `<br><br>If nothing happens, <a href="${info.url}">click here</a>.`;
        location.replace(info.url);
      } catch {
        msg.innerHTML = `The latest version of ${app.name} could not be found.` +
          `<br><br><a href="${RELEASE_PAGE(app.channel)}">Open the download page on GitHub</a>`;
      }
    })();
  </script>
</body>
</html>
