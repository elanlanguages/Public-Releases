# Writes docs/releases.json and rebuilds the site's pages from it (site/build.mjs),
# so visits never call the GitHub API (60 requests/hour per IP).
name: Update releases.json

on:
  release:
    types: [published, edited, deleted]
  schedule:
    - cron: "17 * * * *" # asset uploads to the -latest channels fire no release event
  push:
    branches: [main]
    paths: [docs/apps.js, site/**]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: releases-json
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/releases?per_page=100" --jq '[.[] | {
            tag_name, published_at, body, html_url,
            assets: [.assets[] | {name, size, browser_download_url, updated_at}]
          }]' > docs/releases.json
      - name: Build pages
        run: node site/build.mjs
      - name: Commit if changed
        run: |
          git add -A docs
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update releases and pages"
          git push
